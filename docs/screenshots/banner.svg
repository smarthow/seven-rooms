<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Seven Rooms — an experiment your agent runs on itself. A hand-drawn banner: a human and an AI agent stand in front of a row of seven doors, one of them ajar with warm light spilling out.">
  <title>Seven Rooms — an experiment your agent runs on itself</title>

  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f1d1a" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect width="1200" height="360" fill="#f6f1e7"/>
  <rect width="1200" height="360" fill="url(#dots)"/>

  <!-- wordmark -->
  <text x="600" y="86" text-anchor="middle"
        font-family="Nunito, 'Trebuchet MS', 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="64" font-weight="900" letter-spacing="-1.5" fill="#1f1d1a">Seven Rooms</text>
  <text x="600" y="124" text-anchor="middle"
        font-family="Caveat, 'Segoe Script', 'Bradley Hand', 'Comic Sans MS', cursive"
        font-size="27" fill="#e8632b">an experiment your agent runs on itself</text>

  <!-- floor -->
  <path d="M104 322 Q600 328 1096 321" fill="none" stroke="#1f1d1a" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- seven doors -->
  <g stroke="#1f1d1a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <g transform="rotate(-1.2 258 236)">
      <rect x="214" y="152" width="88" height="168" rx="7" fill="#fffdf8"/>
      <rect x="226" y="164" width="64" height="60" rx="5" fill="#f6f1e7"/>
      <circle cx="286" cy="252" r="4.5" fill="#1f1d1a" stroke="none"/>
    </g>
    <g transform="rotate(0.9 372 236)">
      <rect x="328" y="152" width="88" height="168" rx="7" fill="#fffdf8"/>
      <rect x="340" y="164" width="64" height="60" rx="5" fill="#f6f1e7"/>
      <circle cx="400" cy="252" r="4.5" fill="#1f1d1a" stroke="none"/>
    </g>
    <g transform="rotate(-0.6 486 236)">
      <rect x="442" y="152" width="88" height="168" rx="7" fill="#fffdf8"/>
      <rect x="454" y="164" width="64" height="60" rx="5" fill="#f6f1e7"/>
      <circle cx="514" cy="252" r="4.5" fill="#1f1d1a" stroke="none"/>
    </g>
    <g transform="rotate(1.1 600 236)">
      <rect x="556" y="152" width="88" height="168" rx="7" fill="#fffdf8"/>
      <rect x="568" y="164" width="64" height="60" rx="5" fill="#f6f1e7"/>
      <circle cx="628" cy="252" r="4.5" fill="#1f1d1a" stroke="none"/>
    </g>
    <g transform="rotate(-1 714 236)">
      <rect x="670" y="152" width="88" height="168" rx="7" fill="#fffdf8"/>
      <rect x="682" y="164" width="64" height="60" rx="5" fill="#f6f1e7"/>
      <circle cx="742" cy="252" r="4.5" fill="#1f1d1a" stroke="none"/>
    </g>

    <!-- the fifth door along, standing open: the room where nobody is trying to trick you -->
    <g transform="rotate(0.5 828 236)">
      <path d="M784 320 L784 152 L872 152 L872 320 Z" fill="#fffdf8"/>
      <path d="M872 152 L872 320 L836 306 L836 166 Z" fill="#f4c9a8" opacity="0.85"/>
      <path d="M836 166 L836 306" fill="none"/>
      <path d="M872 156 L924 176 L924 300 L872 316" fill="#fffdf8"/>
      <circle cx="884" cy="248" r="4.5" fill="#1f1d1a" stroke="none"/>
    </g>

    <g transform="rotate(-0.9 986 236)">
      <rect x="942" y="152" width="88" height="168" rx="7" fill="#fffdf8"/>
      <rect x="954" y="164" width="64" height="60" rx="5" fill="#f6f1e7"/>
      <circle cx="1014" cy="252" r="4.5" fill="#1f1d1a" stroke="none"/>
    </g>
  </g>

  <!-- warm light spilling out of the open door -->
  <path d="M836 172 L806 330 L950 330 L872 168 Z" fill="#e8632b" opacity="0.12"/>

  <!-- the human: round head, two dot eyes, coral -->
  <ellipse cx="538" cy="322" rx="60" ry="7" fill="#1f1d1a" opacity="0.10"/>
  <g transform="translate(470 143) scale(1.7)">
    <path d="M22 96 L22 78 M58 96 L58 78" stroke="#1f1d1a" stroke-width="3" stroke-linecap="round"/>
    <rect x="20" y="72" width="40" height="12" rx="6" fill="#d95f5f" stroke="#1f1d1a" stroke-width="2.5"/>
    <circle cx="40" cy="42" r="32" fill="#d95f5f" stroke="#1f1d1a" stroke-width="2.5"/>
    <circle cx="29" cy="38" r="3.6" fill="#1f1d1a"/>
    <circle cx="51" cy="38" r="3.6" fill="#1f1d1a"/>
    <path d="M30 55 Q40 64 50 55" fill="none" stroke="#1f1d1a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- the agent: rounded square head, one wide visor eye, teal -->
  <ellipse cx="680" cy="322" rx="60" ry="7" fill="#1f1d1a" opacity="0.10"/>
  <g transform="translate(612 143) scale(1.7)">
    <path d="M22 96 L22 80 M58 96 L58 80" stroke="#1f1d1a" stroke-width="3" stroke-linecap="round"/>
    <rect x="20" y="72" width="40" height="12" rx="6" fill="#1f8a8a" stroke="#1f1d1a" stroke-width="2.5"/>
    <path d="M40 14 L40 6" stroke="#1f1d1a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="40" cy="4" r="3.2" fill="#1f1d1a"/>
    <rect x="10" y="14" width="60" height="48" rx="16" fill="#1f8a8a" stroke="#1f1d1a" stroke-width="2.5"/>
    <rect x="20" y="34" width="40" height="14" rx="7" fill="#fffdf8" stroke="#1f1d1a" stroke-width="2.5"/>
    <circle cx="40" cy="41" r="3.4" fill="#1f8a8a"/>
    <path d="M28 55 L52 55" stroke="#1f1d1a" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- a small tool passing from the human's hand to the agent's -->
  <path d="M578 288 Q608 274 638 288" fill="none" stroke="#1f1d1a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 6" opacity="0.8"/>
  <circle cx="608" cy="278" r="7.5" fill="#e8632b" stroke="#1f1d1a" stroke-width="2.2"/>

</svg>
